<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#030407" />
  <meta name="description" content="Glooba is an independent app studio building curious things for the internet." />
  <title>Glooba — We make apps</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>

  <header class="site-header">
    <!-- OPTION A: wordmark only. Comment this out if you prefer OPTION B. -->
    <a class="brand brand-wordmark" href="#" aria-label="Glooba home">GLOOBA</a>

    <!-- OPTION B: mascot + wordmark. Uncomment this block and comment OPTION A above. -->
    <!--
    <a class="brand brand-with-mascot" href="#" aria-label="Glooba home">
      <img src="glooba-mascot.png" alt="" />
      <span>GLOOBA</span>
    </a>
    -->
  </header>

  <main>
    <section class="hero">
      <div class="copy">
        <p class="eyebrow"><span class="pulse"></span> Somewhere in development</p>
        <h1>We make apps.<br><span>Something is taking shape.</span></h1>
        <p class="intro">Glooba is an independent app studio. We design and build our own ideas, one curious product at a time.</p>
        <div class="status"><span>01</span><div></div><p>FIRST PROJECT<br><strong>IN DEVELOPMENT</strong></p></div>
      </div>

      <div class="mascot-zone" aria-label="Mr. Glooba floating through space">
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <div class="mascot-floater" id="mascotFloater">
          <div class="mascot-tilt" id="mascotTilt">
            <img src="glooba-mascot.png" alt="Mr. Glooba, the Glooba mascot" draggable="false" />
          </div>
        </div>
        <span class="tiny-star s1">✦</span><span class="tiny-star s2">·</span><span class="tiny-star s3">✧</span>
      </div>
    </section>
  </main>

  <footer>
    <span>© <span id="year"></span> GLOOBA</span>
    <a href="mailto:info@glooba.dev">info@glooba.dev</a>
    <span class="coordinates">BUILDING FROM EARTH</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
